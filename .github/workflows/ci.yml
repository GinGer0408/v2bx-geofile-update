name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check updater syntax without installing services
        run: bash -n install.sh
      - name: Check shell diagnostics
        run: shellcheck -x -P SCRIPTDIR install.sh tests/smoke_upstream.sh
      - name: Check help and version commands
        run: |
          bash install.sh --help
          bash install.sh version
      - name: Test update transactions and recovery
        run: sudo python3 -m unittest discover -s tests -v
